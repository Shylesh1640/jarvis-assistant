[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Local-first hybrid AI assistant (FastAPI + LangGraph + Ollama + Streamlit)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.59.1",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[project.scripts]
jarvis-ingest = "jarvis.cli.ingest:main"
jarvis-validate-runtime = "jarvis.cli.validate_runtime:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
