[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Local-first hybrid AI assistant (FastAPI + LangGraph + Ollama + Streamlit)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.8",  # DOCX ingestion (lightweight, no binary deps)
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.9",
    "pypdf>=5.0",  # PDF ingestion (pure-python)
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0,<3",
    "streamlit>=1.59.1",
    "uvicorn[standard]>=0.51.0",
    "bcrypt>=5.0.0",
    "argon2-cffi>=25.1.0",
    "psutil>=7.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[project.scripts]
jarvis-ingest = "jarvis.cli.ingest:main"
jarvis-validate-runtime = "jarvis.cli.validate_runtime:main"
jarvis-evaluate = "jarvis.cli.evaluate:main"
jarvis-benchmark = "jarvis.benchmark.cli:main"
jarvis-evaluate-performance = "jarvis.benchmark.performance:main"
jarvis-backup = "jarvis.cli.backup:main"
jarvis-verify-backup = "jarvis.cli.backup:verify_latest_main"
jarvis-admin = "jarvis.cli.admin:main"
jarvis-db = "jarvis.cli.db:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.2.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jarvis --cov-report=term-missing:skip-covered --cov-fail-under=0"

[tool.coverage.run]
source = ["src/jarvis"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
    "raise NotImplementedError",
]

